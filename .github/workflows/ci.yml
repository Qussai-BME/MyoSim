name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package, development tools, and optional PyBullet backend
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,pybullet]'
      - name: Verify import boundary
        run: python -c "import myosim; print(myosim.__version__)"
      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Run tests with global coverage gate
        run: pytest -q
      - name: Enforce substantive per-module coverage gate
        run: python scripts/check_coverage_policy.py coverage.json 85
      - name: Headless simulator smoke test
        run: myosim doctor --strict

  distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install release verification tools
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Audit declared dependencies
        run: |
          python scripts/export_audit_requirements.py --output audit-requirements.txt
          pip-audit --progress-spinner off --strict --requirement audit-requirements.txt
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify source-distribution release records
        run: |
          tar -tzf dist/*.tar.gz > sdist-contents.txt
          grep -Eq '/CHANGELOG\.md$' sdist-contents.txt
          grep -Eq '/RELEASE_NOTES_V1\.md$' sdist-contents.txt
          grep -Eq '/SECURITY\.md$' sdist-contents.txt
          grep -Eq '/SUPPORT\.md$' sdist-contents.txt
          grep -Eq '/CODE_OF_CONDUCT\.md$' sdist-contents.txt
      - name: Generate CycloneDX SBOM
        run: |
          pip-audit --progress-spinner off --requirement audit-requirements.txt \
            --format cyclonedx-json --output sbom.cdx.json
      - name: Upload distribution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: myosim-distribution-evidence
          path: |
            dist/
            sbom.cdx.json
            sdist-contents.txt
            audit-requirements.txt
          if-no-files-found: error
