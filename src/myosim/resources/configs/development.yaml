run:
  seed: 20260822
  artifacts_dir: artifacts/development_runs
  log_level: DEBUG

simulation:
  backend: mujoco
  model_path: assets/models/hand.xml
  timestep_s: 0.002
  headless: true
  render_width: 320
  render_height: 240

control:
  confidence_threshold: 0.75
  confirmation_windows: 2
  minimum_dwell_s: 0.04
  hold_duration_s: 0.10
  release_duration_s: 0.05
  ema_alpha: 0.35
  stale_input_timeout_s: 0.20
  command_rate_limit_rad_s: 2.0
  max_joint_target_rad: 1.35
  emergency_stop_on_invalid_state: true

task:
  name: pick_place
  timeout_s: 3.5
  target_radius_m: 0.08
  stable_grasp_steps: 8

recording:
  enabled: false
  debug_overlays: true
  fps: 12
